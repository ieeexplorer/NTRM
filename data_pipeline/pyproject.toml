[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ntrm-data-pipeline"
version = "0.1.0"
description = "Public-data operating snapshots for the NTRM research demonstrator"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "pandas>=2.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
