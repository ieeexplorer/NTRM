[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ntrm-cascade-ml"
version = "0.1.0"
description = "A reproducible DC cascade surrogate and ML baseline for NTRM"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pypower>=5.1.19",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cascade_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
