name: CI

on:
  push:
    branches: [main, research-cascade-prediction]
  pull_request:
    branches: [main, research-cascade-prediction]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# This research prototype supports Python 3.10, 3.11, 3.12 in CI.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install "ruff>=0.5"

      - name: Run ruff check
        run: ruff check cascade_ml agent_control data_pipeline

      - name: Run ruff format check
        run: ruff format --check cascade_ml agent_control data_pipeline

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt mypy>=1.10

      - name: Run mypy
        run: mypy cascade_ml agent_control data_pipeline

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest pytest-cov>=5

      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dashboard dependencies
        run: npm install

      - name: Build dashboard for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Upload dashboard static export
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-static-export
          path: web_dashboard/out
          retention-days: 7
