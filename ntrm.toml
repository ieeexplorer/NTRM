# NTRM Research Demonstrator Configuration
# Copy this file to your working directory as ntrm.toml and adjust values.

[cascade]
overload_threshold = 1.0
max_generations = 20
severe_threshold_fraction = 0.2

[model]
n_estimators = 400
min_samples_leaf = 2
n_cv_splits = 5
classification_threshold = 0.5
n_jobs = -1
seed = 39

[controller]
target_loading_ratio = 0.9
action_step_mw = 10.0
duration_hours = 0.25
maximum_actions = 100
# budget = null  # uncomment to set a cost limit

[resources]
max_shed_fraction = 0.1
minimum_served_fraction = 0.8
battery_max_power_mw = 50.0
battery_energy_mwh = 25.0
battery_initial_soc = 0.8
battery_discharge_efficiency = 0.95
generator_max_increase_mw = 50.0
generator_ramp_mw_per_min = 10.0
generator_response_minutes = 5.0
flex_load_cost_per_mwh = 1000.0
battery_cost_per_mwh = 50.0
generator_cost_per_mwh = 100.0
n_flex_load_agents = 3
n_battery_agents = 2

[mapping]
reference_demand_mw = 30000.0
minimum_scale = 0.75
maximum_scale = 1.25